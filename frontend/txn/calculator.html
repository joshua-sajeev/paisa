<script>
    // State management
    let rawAmount = "1250";
    let currentType = "expense"; // expense | income | transfer

    const config = {
      expense: {
        color: '#ef4444',
        accentClass: 'text-red-500',
        bgAccentClass: 'bg-red-500',
        hoverBgClass: 'hover:bg-red-600',
        shadowClass: 'shadow-red-500/25',
        sign: '-',
        subtitle: 'Money going out from HDFC Bank (₹28,450 available)',
        activePill: 'bg-white text-red-600 border border-red-200/80 ring-2 ring-red-500/10 shadow-sm',
      },
      income: {
        color: '#10b981',
        accentClass: 'text-emerald-500',
        bgAccentClass: 'bg-emerald-500',
        hoverBgClass: 'hover:bg-emerald-600',
        shadowClass: 'shadow-emerald-500/25',
        sign: '+',
        subtitle: 'Money coming in to Primary Account',
        activePill: 'bg-white text-emerald-600 border border-emerald-200/80 ring-2 ring-emerald-500/10 shadow-sm',
      },
      transfer: {
        color: '#2563eb',
        accentClass: 'text-blue-600',
        bgAccentClass: 'bg-blue-600',
        hoverBgClass: 'hover:bg-blue-700',
        shadowClass: 'shadow-blue-500/25',
        sign: '⇄',
        subtitle: 'Move between accounts or to Jars',
        activePill: 'bg-white text-blue-600 border border-blue-200/80 ring-2 ring-blue-500/10 shadow-sm',
      }
    };

    function updateAmountDisplay() {
      const displayElem = document.getElementById('amount-display');
      if (!rawAmount || rawAmount === "0") {
        displayElem.innerText = "0";
        return;
      }

      // Format with Indian Rupee grouping if possible
      const parts = rawAmount.split('.');
      let integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

      // Indian numbering format regex: last 3 digits, then groups of 2
      let lastThree = integerPart.substring(integerPart.length - 3);
      let otherNumbers = integerPart.substring(0, integerPart.length - 3);
      if (otherNumbers !== '') {
        lastThree = ',' + lastThree;
      }
      let formattedInteger = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;

      displayElem.innerText = (formattedInteger || "0") + decimalPart;
    }

    function appendDigit(d) {
      if (rawAmount === "0" && d !== "0") {
        rawAmount = d;
      } else if (rawAmount.length < 9) {
        // Prevent more than 2 decimal places
        if (rawAmount.includes('.')) {
          const parts = rawAmount.split('.');
          if (parts[1] && parts[1].length >= 2) return;
        }
        rawAmount += d;
      }
      updateAmountDisplay();
    }

    function appendDecimal() {
      if (!rawAmount.includes('.')) {
        rawAmount = rawAmount === "" ? "0." : rawAmount + ".";
        updateAmountDisplay();
      }
    }

    function deleteDigit() {
      if (rawAmount.length > 0) {
        rawAmount = rawAmount.slice(0, -1);
      }
      if (rawAmount === "") {
        rawAmount = "0";
      }
      updateAmountDisplay();
    }

    function clearAmount() {
      rawAmount = "0";
      updateAmountDisplay();
    }

    function addQuickAmount(val) {
      let currentVal = parseFloat(rawAmount) || 0;
      currentVal += val;
      rawAmount = currentVal.toString();
      updateAmountDisplay();
    }

    function setType(type) {
      currentType = type;
      const c = config[type];

      // 1. Update selector buttons
      ['expense', 'income', 'transfer'].forEach(t => {
        const btn = document.getElementById(`type-${t}`);
        if (t === type) {
          btn.className = `flex-1 py-3 px-3 rounded-xl flex items-center justify-center gap-2 text-xs sm:text-sm font-bold smooth-transition ${config[t].activePill}`;
        } else {
          btn.className = "flex-1 py-3 px-3 rounded-xl flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 hover:bg-white/50 smooth-transition";
        }
      });

      // 2. Update currency symbol and cursor accent
      const sym = document.getElementById('currency-symbol');
      const cursor = document.getElementById('blinking-cursor');
      const sign = document.getElementById('sign-indicator');
      const subtitle = document.getElementById('type-subtitle');

      sym.style.color = c.color;
      cursor.style.backgroundColor = c.color;
      sign.style.color = c.color;
      sign.innerText = c.sign;

      subtitle.children[1].innerText = c.subtitle;

      // 3. Update CTA button color & shadow
      const cta = document.getElementById('cta-button');
      cta.className = `w-full py-4 px-6 rounded-2xl font-bold text-white shadow-lg flex items-center justify-center gap-2.5 transition-all duration-200 active:scale-[0.98] ${c.bgAccentClass} ${c.hoverBgClass} ${c.shadowClass}`;
    }

    // Initialize display
    updateAmountDisplay();
  </script>

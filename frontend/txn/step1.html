utton><button class="h-11 rounded-xl hover:bg-slate-100 text-slate-800 font-semibold text-lg active:scale-95 transition-all" onclick="calcAppend('3')">3</button><button class="h-11 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-lg active:scale-95 transition-all row-span-2 flex items-center justify-center" onclick="calcEvaluate()">=</button><button class="h-11 rounded-xl hover:bg-slate-100 text-slate-800 font-semibold text-lg active:scale-95 transition-all col-span-2" onclick="calcAppend('0')">0</button><button class="h-11 rounded-xl hover:bg-slate-100 text-slate-800 font-bold text-lg active:scale-95 transition-all" onclick="calcAppend('.')">•</button></div><div class="px-4 pb-4 pt-1 flex items-center gap-2"><button class="flex-1 py-3 px-4 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 active:scale-95 transition-all" onclick="closeCalculator()" type="button">Cancel</button><button class="flex-[2] py-3 px-4 rounded-xl font-bold text-xs text-white shadow-md flex items-center justify-center gap-1.5 transition-all duration-200 active:scale-95 bg-red-500 hover:bg-red-600 shadow-red-500/25" id="calc-apply-btn" onclick="applyCalculatorResult()" type="button"><span class="">Apply ₹1,630 to Amount</span><i class="fa-solid fa-arrow-right text-[10px]"></i></button></div><div class="w-full pb-2 flex justify-center"><div class="w-24 h-1 bg-slate-200 rounded-full"></div></div></div></div>

              <script>
    // State management
                let rawAmount = "1250";
                let currentType = "expense"; // expense | income | transfer

                const config = {
                  expense: {
                  color: '#ef4444',
                accentClass: 'text-red-500',
                bgAccentClass: 'bg-red-500',
                hoverBgClass: 'hover:bg-red-600',
                shadowClass: 'shadow-red-500/25',
                sign: '-',
                subtitle: 'Money going out from HDFC Bank (₹28,450 available)',
                activePill: 'bg-white text-red-600 border border-red-200/80 ring-2 ring-red-500/10 shadow-sm',
      },
                income: {
                  color: '#10b981',
                accentClass: 'text-emerald-500',
                bgAccentClass: 'bg-emerald-500',
                hoverBgClass: 'hover:bg-emerald-600',
                shadowClass: 'shadow-emerald-500/25',
                sign: '+',
                subtitle: 'Money coming in to Primary Account',
                activePill: 'bg-white text-emerald-600 border border-emerald-200/80 ring-2 ring-emerald-500/10 shadow-sm',
      },
                transfer: {
                  color: '#2563eb',
                accentClass: 'text-blue-600',
                bgAccentClass: 'bg-blue-600',
                hoverBgClass: 'hover:bg-blue-700',
                shadowClass: 'shadow-blue-500/25',
                sign: '⇄',
                subtitle: 'Move between accounts or to Jars',
                activePill: 'bg-white text-blue-600 border border-blue-200/80 ring-2 ring-blue-500/10 shadow-sm',
      }
    };

                function updateAmountDisplay() {
      const displayElem = document.getElementById('amount-display');
                if (!rawAmount || rawAmount === "0") {
                  displayElem.innerText = "0";
                return;
      }

                // Format with Indian Rupee grouping if possible
                const parts = rawAmount.split('.');
                let integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

                // Indian numbering format regex: last 3 digits, then groups of 2
                let lastThree = integerPart.substring(integerPart.length - 3);
                let otherNumbers = integerPart.substring(0, integerPart.length - 3);
                if (otherNumbers !== '') {
                  lastThree = ',' + lastThree;
      }
                let formattedInteger = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;

                displayElem.innerText = (formattedInteger || "0") + decimalPart;
    }

                function appendDigit(d) {
      if (rawAmount === "0" && d !== "0") {
                  rawAmount = d;
      } else if (rawAmount.length < 9) {
        // Prevent more than 2 decimal places
